mission_state_machine:
  waypoints:
    - [2.0, 0.0, 0.0]
    - [5.0, 1.5, 0.0]
    - [8.0, -1.0, 0.0]
    - [10.0, 0.0, 0.0]

scenario_sensor_sim:
  use_time_script: true
  # Scene A is the PR-1/PR-2 fairness smoke test: perception is scripted by
  # time so all strategies receive the same shared input sequence.
  use_position_script: false
  base_obstacle_density: 0.05
  slope_zone_deg: 35.0
  barrier_obstacle_density: 0.85
  slope_event_start: 8.0
  slope_event_end: 14.0
  obstacle_event_start: 18.0
  obstacle_event_end: 28.0
  slope_zone_x_min: 3.5
  slope_zone_x_max: 4.8
  barrier_x_min: 6.2
  barrier_x_max: 7.8
  barrier_y_half_width: 1.4
